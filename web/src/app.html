<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f7f7fc" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="description" content="Five browser games for spatial reasoning, programming, route planning, simulation and music." />
		<meta property="og:site_name" content="drbrain" />
		<meta property="og:title" content="drbrain · A playground for curious minds" />
		<meta property="og:description" content="Five browser games for spatial reasoning, programming, route planning, simulation and music." />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://drbrain.wricardo.net/art/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="drbrain. A playground for curious minds, with a violet maze and golden path." />
		<meta name="twitter:card" content="summary_large_image" />
		<!-- Applies the saved or OS theme before first paint, so there is no flash. Mirrors src/lib/theme.ts. -->
		<script>
			(function () {
				var path = location.pathname;
				var inMotor = path === '/motor' || path.indexOf('/motor/') === 0;
				var saved = null;
				var dark = false;
				if (inMotor) {
					try {
						saved = localStorage.getItem('drbrain-motor-programming.theme');
					} catch (e) {}
					dark = saved === 'dark';
					if (saved !== 'dark' && saved !== 'light') {
						try {
							dark = matchMedia('(prefers-color-scheme: dark)').matches;
						} catch (e) {}
					}
				}
				var root = document.documentElement;
				root.classList.toggle('dark', dark);
				root.style.colorScheme = dark ? 'dark' : 'light';
				if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#171936');
			})();
		</script>
		<style>
			/* Dark canvas until the stylesheet arrives (the app is a client-rendered SPA). */
			html.dark {
				background-color: #0e0f24;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
