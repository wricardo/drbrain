# Project-level omp settings (higher precedence than ~/.omp/agent/config.yml).
#
# Managed (autolearn) skills land globally in ~/.omp/agent/managed-skills and are
# discovered unconditionally, so an allowlist is the only way to keep other repos'
# skills out of this repo. includeSkills filters EVERY provider, so authored skills
# are listed explicitly: a new authored skill must be added here to appear.
# Upstream: can1357/oh-my-pi#4067.
skills:
  includeSkills:
    - "agent-sdk-create-agent"
    - "agents/aicurl"
    - "agents/gqlcli"
    - "aicurl"
    - "automate"
    - "autopilot"
