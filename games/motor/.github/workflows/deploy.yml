name: Deploy

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # The PostgreSQL-backed tests run when TEST_DATABASE_URL is set (they skip otherwise).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: drbrain
          POSTGRES_PASSWORD: drbrain_ci
          POSTGRES_DB: drbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drbrain -d drbrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://drbrain:drbrain_ci@localhost:5432/drbrain?sslmode=disable

      # The SvelteKit UI is prebuilt and committed in static/. import-json is the
      # JSON <-> PostgreSQL cutover/export tool; it ships so the host needs no Go
      # toolchain to run a cutover.
      - name: Build binaries (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/drbrain-motor-programming .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/import-json ./cmd/import-json

      - name: Package
        run: |
          mkdir -p /tmp/pkg
          cp /tmp/drbrain-motor-programming /tmp/import-json /tmp/pkg/
          cp docker-compose.prod.yaml /tmp/pkg/
          cp -r maps static /tmp/pkg/
          tar czf /tmp/deploy.tgz -C /tmp/pkg .

      - name: Setup SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?missing EC2_HOST secret}"
          : "${EC2_SSH_KEY:?missing EC2_SSH_KEY secret}"
          : "${EC2_KNOWN_HOSTS:?missing EC2_KNOWN_HOSTS secret}"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $EC2_HOST
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            BatchMode yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload
        run: scp /tmp/deploy.tgz deploy:/tmp/drbrain-motor-programming-deploy.tgz

      # Systemd unit, nginx vhost, Docker and /opt/drbrain-motor-programming/.env are
      # provisioned once on the host; this step only swaps the release.
      # sessions/, maps-user/, accounts/ and .env are preserved (the file stores are
      # the rollback path); only maps/, static/, the binaries and the compose file
      # are replaced. The PostgreSQL volume lives outside the release directory.
      - name: Install and restart
        run: |
          ssh deploy '
            set -euo pipefail
            cd /opt/drbrain-motor-programming
            rm -rf maps static
            tar xzf /tmp/drbrain-motor-programming-deploy.tgz -C .
            rm -f /tmp/drbrain-motor-programming-deploy.tgz
            mkdir -p sessions maps-user
            # Reconcile the production database before the app starts; the unit
            # repeats this in ExecStartPre so a plain restart does the same. A host
            # still on the JSON file stores has no DATABASE_URL and skips this.
            if grep -q "^DATABASE_URL=." .env 2>/dev/null && command -v docker >/dev/null; then
              sudo docker compose -f docker-compose.prod.yaml up -d --wait postgres
            fi
            sudo systemctl restart drbrain-motor-programming.service
            systemctl is-active drbrain-motor-programming.service
          '

      - name: Smoke test
        run: |
          ssh deploy '
            for attempt in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8086/graphql \
                -H "content-type: application/json" \
                --data "{\"query\":\"query { maps { id } }\"}" | grep -q "\"maps\""; then
                # Sign-in (username/password) is on by default; it silently refuses
                # requests when the host has no -public-url, so check it is offered.
                curl -fsS http://127.0.0.1:8086/graphql \
                  -H "content-type: application/json" \
                  --data "{\"query\":\"query { authProviders { id } }\"}" | grep -q "\"password\"" \
                  || { echo "password sign-in is not offered" >&2; exit 1; }
                exit 0
              fi
              sleep 5
            done
            exit 1
          '
