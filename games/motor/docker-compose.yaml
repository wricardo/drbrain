# Local PostgreSQL for development. The app runs on the host and connects to it
# on localhost:5432; set POSTGRES_PORT when something else already holds that port.
# `just db-up` starts it, `just db-down` stops it, `just dev-db` runs the app against it.
# The credentials are a development default only; never reuse them anywhere else.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drbrain_dev}
      POSTGRES_DB: drbrain
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drbrain -d drbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
